<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu primeiro programa...</title>
    <style> /*Comentário em CSS*/
        body {
            background-color: rgba(105, 105, 173);
            color: white;
            font-family: Arial, Helvetica, sans-serif;
        }
    </style>
</head>
<body>
    <h1>Olá, Mundo!</h1> <!--Comentário em HTML-->
    <p>Já mim livrei da maldição!!</p>
    <script>
        var n1 = Number(window.prompt('digite um número:')) // String
        var n2 = Number(window.prompt('Digite outro número:'))// String
        var s = n1 + n2
        window.alert (`A soma entre ${n1} e ${n2} é igual a ${s}`)//Concatenação
        // (number + number) para adição
        //(String + string) para concanetação
    </script>
</body>
</html>
